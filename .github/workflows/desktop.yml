name: ZeroWaste Listening Studio downloads
on:
  workflow_dispatch:
  push:
    branches: [codex/studio-electron-download-20261026]
permissions:
  contents: read
concurrency:
  group: listening-studio-downloads-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-latest
            target: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:desktop
      - name: Build installer on its native operating system
        run: npm run package:${{ matrix.target }} -- --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Electron app
        run: node scripts/verify-packaged.mjs
      - name: Record project identity and checksums
        run: node scripts/release-artifacts.mjs ${{ matrix.target }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZeroWaste-Listening-Studio-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.sha256
            release/*-build.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Studio-failure-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            test-results/
            release/builder-debug.yml
          if-no-files-found: ignore
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ZeroWaste-Listening-Studio-*
          path: release
          merge-multiple: true
      - name: Archive this exact source revision
        run: node scripts/source-archive.mjs
      - name: Publish this Electron project's test downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="listening-studio-electron-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.dmg release/*.zip release/*.exe release/*.sha256 release/*-build.json --clobber
          else
            gh release create "$tag" release/*.dmg release/*.zip release/*.exe release/*.sha256 release/*-build.json \
              --target "$GITHUB_SHA" --prerelease --title "ZeroWaste Listening Studio 0.1.0 · Electron test" --notes-file docs/RELEASE_NOTES.md
          fi
