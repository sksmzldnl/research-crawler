[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zerowaste-listener"
version = "0.1.0"
description = "제로웨이스트 소비자 조사를 위한 소셜 리스닝 데스크톱 앱"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials==6.8.3", "httpx==0.28.1", "trafilatura==2.0.0", "keyring==25.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.12.0"]

[project.gui-scripts]
zerowaste-listener = "zerowaste_listener.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
