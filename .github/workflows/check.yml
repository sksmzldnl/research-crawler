name: Build and test
on:
  push:
    branches-ignore: ['codex/studio-delivery-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci-step.mjs npm run test:ui
      - name: Record UI verification outcome
        if: always()
        run: node scripts/ci-delivery-report.mjs original-ui ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-evidence
          path: test-results/
